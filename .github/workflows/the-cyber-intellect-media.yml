name: The Cyber Intellect media renderer
on:
  push:
    branches: [main]
    paths:
      - 'the-cyber-intellect/content/*.json'
      - 'the-cyber-intellect/render.py'
      - 'the-cyber-intellect/render_reels.py'
      - '.github/workflows/the-cyber-intellect-media.yml'
  workflow_dispatch:
concurrency:
  group: cyber-intellect-media-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow and FFmpeg
        run: |
          python -m pip install 'Pillow>=11,<13'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Render portrait images and MP4 motion-graphic reels
        run: |
          LATEST=$(find the-cyber-intellect/content -maxdepth 1 -name '*.json' | sort | tail -n 1)
          echo "Rendering: $LATEST"
          python the-cyber-intellect/render.py "$LATEST"
          python the-cyber-intellect/render_reels.py "$LATEST"
      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the-cyber-intellect/media/
          if ! git diff --cached --quiet; then
            git commit -m "Render Cyber Intellect Instagram Reels and images"
            git pull --rebase origin main
            git push
          fi
