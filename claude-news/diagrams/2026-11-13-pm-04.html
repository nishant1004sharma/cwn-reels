<!doctype html>
<!--
  Animated explainer template (kind "diagram"). Copy to claude-news/diagrams/<item id>.html and edit.
  Canvas 1080x1350 (4:5). Clean white background, dark text, coloured outlines only.
  Animated pieces (all loop every 2 s so the video loops seamlessly):
    path.flow   blue dashed arrow      path.flowG  green dashed arrow
    path.flowR  red dashed arrow, faster (the attack / bad path)
    .pulse      gentle scale pulse     .blink      fading text
  Keep text >= 20px, max ~12 boxes, one idea per panel.
-->
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Inter;font-weight:400 500;src:url('../../render/fonts/Inter-Medium.otf')}
  @font-face{font-family:Inter;font-weight:600 900;src:url('../../render/fonts/Inter-SemiBold.otf')}
  @font-face{font-family:'Inter Display';font-weight:700 900;src:url('../../render/fonts/InterDisplay-Bold.otf')}
  :root{--ink:#111827;--muted:#4b5563;--blue:#2563eb;--green:#059669;--red:#dc2626;--line:#d1d5db}
  html,body{margin:0;padding:0;background:#fff}
  body{width:1080px;height:1350px;overflow:hidden}
  svg{position:absolute;inset:0}
  text{font-family:Inter,sans-serif;fill:var(--ink)}
  .brand{font-size:22px;font-weight:800;letter-spacing:3px;fill:var(--blue)}
  .title{font-family:'Inter Display',Inter,sans-serif;font-size:64px;font-weight:800}
  .sub{font-size:28px;fill:var(--muted)}
  .panelT{font-size:32px;font-weight:800}
  .lbl{font-size:26px;font-weight:700;text-anchor:middle}
  .small{font-size:21px;fill:var(--muted);text-anchor:middle}
  .box{fill:#fff;stroke:#9ca3af;stroke-width:2.5}
  .boxB{fill:#eff6ff;stroke:var(--blue);stroke-width:3}
  .boxG{fill:#ecfdf5;stroke:var(--green);stroke-width:3}
  .boxR{fill:#fef2f2;stroke:var(--red);stroke-width:3}
  .flow,.flowG,.flowR{fill:none;stroke-width:4;stroke-dasharray:14 12;animation:dash 1s linear infinite}
  .flow{stroke:var(--blue)} .flowG{stroke:var(--green)}
  .flowR{stroke:var(--red);stroke-width:5;animation-duration:.5s}
  @keyframes dash{from{stroke-dashoffset:26}to{stroke-dashoffset:0}}
  .blink{animation:blink 1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
</style></head>
<body>
<svg width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker>
  </defs>

  <text class="brand" x="60" y="70">THE CYBER INTELLECT</text>
  <text class="title" x="60" y="148" style="font-size:58px">Hijacked GitHub Login → Cloud</text>
  <text class="sub" x="60" y="194">4,837 hijacked accounts · stealer in 1,806+ repos (Aikido)</text>

  <!-- Panel 1: attack path -->
  <rect x="40" y="225" width="1000" height="520" rx="26" fill="#f9fafb" stroke="#dc2626" stroke-width="2.5"/>
  <text class="panelT" x="70" y="277" style="fill:#dc2626">✗ The attack path</text>

  <rect class="boxR" x="70" y="310" width="270" height="130" rx="18"/>
  <text class="lbl" x="205" y="363">Stolen login</text>
  <text class="small" x="205" y="397">a dev's GitHub account</text>

  <rect class="box" x="405" y="310" width="270" height="130" rx="18"/>
  <text class="lbl" x="540" y="363">New commit</text>
  <text class="small" x="540" y="397">stealer in a workflow</text>

  <g class="pulse">
    <rect class="boxR" x="740" y="300" width="270" height="150" rx="20"/>
    <text class="lbl" x="875" y="355">CI runs it</text>
    <text class="small blink" x="875" y="391" style="fill:#dc2626;font-weight:800">secrets sent out</text>
    <text class="small" x="875" y="423">Actions secrets · tokens</text>
  </g>

  <path class="flowR" d="M340,375 L395,375" marker-end="url(#aR)"/>
  <path class="flowR" d="M675,375 L730,375" marker-end="url(#aR)"/>
  <path class="flowR" d="M875,450 L875,515" marker-end="url(#aR)"/>

  <rect class="boxR" x="600" y="525" width="410" height="130" rx="18"/>
  <text class="lbl" x="805" y="578">OIDC token → cloud</text>
  <text class="small" x="805" y="612">AWS · GCP · Azure sessions</text>

  <path class="flowR" d="M600,590 L485,590" marker-end="url(#aR)"/>

  <rect class="boxR" x="70" y="525" width="405" height="130" rx="18"/>
  <text class="lbl" x="272" y="578">New keys, new trust</text>
  <text class="small" x="272" y="612">IAM keys · trust policies</text>

  <text x="540" y="712" style="font-size:23px;font-weight:700;text-anchor:middle;fill:#dc2626">Aikido: an account that opened a test PR is compromised</text>

  <!-- Panel 2: response -->
  <rect x="40" y="770" width="1000" height="300" rx="26" fill="#f9fafb" stroke="#059669" stroke-width="2.5"/>
  <text class="panelT" x="70" y="822" style="fill:#059669">✓ If an account was hit</text>

  <rect class="boxG" x="70" y="855" width="270" height="130" rx="18"/>
  <text class="lbl" x="205" y="908" style="fill:#059669">Revoke</text>
  <text class="small" x="205" y="942">tokens · OAuth · SSH</text>

  <rect class="boxB" x="405" y="855" width="270" height="130" rx="18"/>
  <text class="lbl" x="540" y="908">2FA on</text>
  <text class="small" x="540" y="942">end all sessions</text>

  <rect class="boxG" x="740" y="855" width="270" height="130" rx="18"/>
  <text class="lbl" x="875" y="908" style="fill:#059669">Rotate</text>
  <text class="small" x="875" y="942">every secret it can read</text>

  <path class="flowG" d="M340,920 L395,920" marker-end="url(#aG)"/>
  <path class="flowG" d="M675,920 L730,920" marker-end="url(#aG)"/>
  <text x="540" y="1035" style="font-size:23px;font-weight:700;text-anchor:middle;fill:#059669">Ran npm install on a bad commit? Treat that machine as hit</text>

  <!-- Takeaway -->
  <rect x="40" y="1095" width="1000" height="190" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text class="panelT" x="70" y="1145" style="fill:#2563eb;font-size:30px">Hunt in your cloud logs</text>
  <text x="70" y="1192" style="font-size:24px">① AWS: wfx-* role sessions, then CreateAccessKey</text>
  <text x="70" y="1232" style="font-size:24px">② Entra ID: wfx-ci-* federated credentials</text>
  <text x="70" y="1270" style="font-size:24px">③ GCP: token calls from your GitHub identity pool</text>

  <text x="540" y="1328" style="font-size:24px;font-weight:800;text-anchor:middle">↗ Send this to whoever owns your GitHub org</text>
</svg>
</body></html>
