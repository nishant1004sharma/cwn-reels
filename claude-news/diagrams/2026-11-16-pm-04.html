<!doctype html>
<!--
  Animated explainer template (kind "diagram"). Copy to claude-news/diagrams/<item id>.html and edit.
  Canvas 1080x1350 (4:5). Clean white background, dark text, coloured outlines only.
  Animated pieces (all loop every 2 s so the video loops seamlessly):
    path.flow   blue dashed arrow      path.flowG  green dashed arrow
    path.flowR  red dashed arrow, faster (the attack / bad path)
    .pulse      gentle scale pulse     .blink      fading text
  Keep text >= 20px, max ~12 boxes, one idea per panel.
-->
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Inter;font-weight:400 500;src:url('../../render/fonts/Inter-Medium.otf')}
  @font-face{font-family:Inter;font-weight:600 900;src:url('../../render/fonts/Inter-SemiBold.otf')}
  @font-face{font-family:'Inter Display';font-weight:700 900;src:url('../../render/fonts/InterDisplay-Bold.otf')}
  :root{--ink:#111827;--muted:#4b5563;--blue:#2563eb;--green:#059669;--red:#dc2626;--line:#d1d5db}
  html,body{margin:0;padding:0;background:#fff}
  body{width:1080px;height:1350px;overflow:hidden}
  svg{position:absolute;inset:0}
  text{font-family:Inter,sans-serif;fill:var(--ink)}
  .brand{font-size:22px;font-weight:800;letter-spacing:3px;fill:var(--blue)}
  .title{font-family:'Inter Display',Inter,sans-serif;font-size:64px;font-weight:800}
  .sub{font-size:28px;fill:var(--muted)}
  .panelT{font-size:32px;font-weight:800}
  .lbl{font-size:26px;font-weight:700;text-anchor:middle}
  .small{font-size:21px;fill:var(--muted);text-anchor:middle}
  .box{fill:#fff;stroke:#9ca3af;stroke-width:2.5}
  .boxB{fill:#eff6ff;stroke:var(--blue);stroke-width:3}
  .boxG{fill:#ecfdf5;stroke:var(--green);stroke-width:3}
  .boxR{fill:#fef2f2;stroke:var(--red);stroke-width:3}
  .flow,.flowG,.flowR{fill:none;stroke-width:4;stroke-dasharray:14 12;animation:dash 1s linear infinite}
  .flow{stroke:var(--blue)} .flowG{stroke:var(--green)}
  .flowR{stroke:var(--red);stroke-width:5;animation-duration:.5s}
  @keyframes dash{from{stroke-dashoffset:26}to{stroke-dashoffset:0}}
  .blink{animation:blink 1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
</style></head>
<body>
<svg width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker>
  </defs>

  <text class="brand" x="60" y="70">THE CYBER INTELLECT</text>
  <text class="title" x="60" y="148">Pinned Isn't Frozen: MCP</text>
  <text class="sub" x="60" y="194">Why your AI assistant's tool server can change by itself</text>

  <!-- Panel 1: drifting -->
  <rect x="40" y="230" width="1000" height="430" rx="26" fill="#f9fafb" stroke="#dc2626" stroke-width="2.5"/>
  <text class="panelT" x="70" y="282" style="fill:#dc2626">✗ "Pinned" with npx -y / uvx</text>

  <rect class="box" x="70" y="320" width="250" height="110" rx="18"/>
  <text class="lbl" x="195" y="368">.mcp.json</text>
  <text class="small" x="195" y="400">top package only</text>

  <rect class="boxB" x="415" y="320" width="250" height="110" rx="18"/>
  <text class="lbl" x="540" y="368">Launcher</text>
  <text class="small" x="540" y="400">resolves every launch</text>

  <g class="pulse">
    <rect class="boxR" x="760" y="310" width="250" height="130" rx="18"/>
    <text class="lbl" x="885" y="360">Public registry</text>
    <text class="small blink" x="885" y="395" style="fill:#dc2626;font-weight:800">new dependency</text>
    <text class="small blink" x="885" y="421" style="fill:#dc2626;font-weight:800">version today</text>
  </g>

  <rect class="boxR" x="415" y="500" width="250" height="110" rx="18"/>
  <text class="lbl" x="540" y="548">MCP server</text>
  <text class="small" x="540" y="580">runs changed code</text>

  <rect class="box" x="70" y="500" width="250" height="110" rx="18"/>
  <text class="lbl" x="195" y="548">AI assistant</text>
  <text class="small" x="195" y="580">trusts it</text>

  <path class="flow" d="M320,375 L405,375" marker-end="url(#aB)"/>
  <path class="flow" d="M665,375 L750,375" marker-end="url(#aB)"/>
  <path class="flowR" d="M885,440 L885,555 L675,555" marker-end="url(#aR)"/>
  <path class="flowR" d="M415,555 L330,555" marker-end="url(#aR)"/>
  <text x="790" y="632" style="font-size:22px;font-weight:700;text-anchor:middle;fill:#dc2626">1 commit: 15 dependency sets in 5 weeks</text>

  <!-- Panel 2: frozen -->
  <rect x="40" y="690" width="1000" height="410" rx="26" fill="#f9fafb" stroke="#059669" stroke-width="2.5"/>
  <text class="panelT" x="70" y="742" style="fill:#059669">✓ Frozen</text>

  <rect class="box" x="70" y="780" width="250" height="110" rx="18"/>
  <text class="lbl" x="195" y="828">Exact version</text>
  <text class="small" x="195" y="860">pkg@x.y.z</text>

  <rect class="boxG" x="415" y="780" width="250" height="110" rx="18"/>
  <text class="lbl" x="540" y="828">Lockfile / image</text>
  <text class="small" x="540" y="860">by digest</text>

  <rect class="boxB" x="760" y="780" width="250" height="110" rx="18"/>
  <text class="lbl" x="885" y="828">Internal proxy</text>
  <text class="small" x="885" y="860">logged</text>

  <rect class="boxG" x="415" y="960" width="250" height="110" rx="18"/>
  <text class="lbl" x="540" y="1008" style="fill:#059669">Same code</text>
  <text class="small" x="540" y="1040">every launch</text>

  <path class="flowG" d="M320,835 L405,835" marker-end="url(#aG)"/>
  <path class="flowG" d="M665,835 L750,835" marker-end="url(#aG)"/>
  <path class="flowG" d="M885,890 L885,1015 L675,1015" marker-end="url(#aG)"/>
  <text x="195" y="1010" style="font-size:22px;font-weight:700;text-anchor:middle;fill:#059669">Updates = a</text>
  <text x="195" y="1040" style="font-size:22px;font-weight:700;text-anchor:middle;fill:#059669">reviewed change</text>

  <!-- Takeaway -->
  <rect x="40" y="1130" width="1000" height="150" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text class="panelT" x="70" y="1180" style="fill:#2563eb;font-size:30px">Defences</text>
  <text x="70" y="1225" style="font-size:25px">① Inventory MCP configs  ② Pin exact versions + lockfile</text>
  <text x="70" y="1261" style="font-size:25px">③ Release-age cooldown  ④ Review MCP config changes</text>

  <text x="540" y="1322" style="font-size:24px;font-weight:800;text-anchor:middle">↗ Send this to whoever approves your AI coding tools</text>
</svg>
</body></html>
