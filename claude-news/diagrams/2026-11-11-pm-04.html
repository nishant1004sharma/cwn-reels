<!doctype html>
<!--
  Animated explainer template (kind "diagram"). Copy to claude-news/diagrams/<item id>.html and edit.
  Canvas 1080x1350 (4:5). Clean white background, dark text, coloured outlines only.
  Animated pieces (all loop every 2 s so the video loops seamlessly):
    path.flow   blue dashed arrow      path.flowG  green dashed arrow
    path.flowR  red dashed arrow, faster (the attack / bad path)
    .pulse      gentle scale pulse     .blink      fading text
  Keep text >= 20px, max ~12 boxes, one idea per panel.
-->
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Inter;font-weight:400 500;src:url('../../render/fonts/Inter-Medium.otf')}
  @font-face{font-family:Inter;font-weight:600 900;src:url('../../render/fonts/Inter-SemiBold.otf')}
  @font-face{font-family:'Inter Display';font-weight:700 900;src:url('../../render/fonts/InterDisplay-Bold.otf')}
  :root{--ink:#111827;--muted:#4b5563;--blue:#2563eb;--green:#059669;--red:#dc2626;--line:#d1d5db}
  html,body{margin:0;padding:0;background:#fff}
  body{width:1080px;height:1350px;overflow:hidden}
  svg{position:absolute;inset:0}
  text{font-family:Inter,sans-serif;fill:var(--ink)}
  .brand{font-size:22px;font-weight:800;letter-spacing:3px;fill:var(--blue)}
  .title{font-family:'Inter Display',Inter,sans-serif;font-size:64px;font-weight:800}
  .sub{font-size:28px;fill:var(--muted)}
  .panelT{font-size:32px;font-weight:800}
  .lbl{font-size:26px;font-weight:700;text-anchor:middle}
  .small{font-size:21px;fill:var(--muted);text-anchor:middle}
  .box{fill:#fff;stroke:#9ca3af;stroke-width:2.5}
  .boxB{fill:#eff6ff;stroke:var(--blue);stroke-width:3}
  .boxG{fill:#ecfdf5;stroke:var(--green);stroke-width:3}
  .boxR{fill:#fef2f2;stroke:var(--red);stroke-width:3}
  .flow,.flowG,.flowR{fill:none;stroke-width:4;stroke-dasharray:14 12;animation:dash 1s linear infinite}
  .flow{stroke:var(--blue)} .flowG{stroke:var(--green)}
  .flowR{stroke:var(--red);stroke-width:5;animation-duration:.5s}
  @keyframes dash{from{stroke-dashoffset:26}to{stroke-dashoffset:0}}
  .blink{animation:blink 1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
</style></head>
<body>
<svg width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker>
  </defs>

  <text class="brand" x="60" y="70">THE CYBER INTELLECT</text>
  <text class="title" x="60" y="148">Plex2Shell: Open Port vs VPN</text>
  <text class="sub" x="60" y="194">Plex Media Server on a QNAP NAS, exploited since mid-October</text>

  <!-- Panel 1: exposed -->
  <rect x="40" y="225" width="1000" height="380" rx="26" fill="#f9fafb" stroke="#dc2626" stroke-width="2.5"/>
  <text class="panelT" x="70" y="277" style="fill:#dc2626">✗ Port 32400 open to the internet</text>

  <rect class="box" x="70" y="315" width="270" height="130" rx="18"/>
  <text class="lbl" x="205" y="368">Attacker</text>
  <text class="small" x="205" y="402">public PoC since Oct</text>

  <g class="pulse">
    <rect class="boxR" x="405" y="305" width="270" height="150" rx="20"/>
    <text class="lbl" x="540" y="358">Plex on your NAS</text>
    <text class="small blink" x="540" y="394" style="fill:#dc2626;font-weight:800">no valid login needed</text>
    <text class="small" x="540" y="426">4-flaw chain</text>
  </g>

  <rect class="boxR" x="740" y="315" width="270" height="130" rx="18"/>
  <text class="lbl" x="875" y="368">Code runs</text>
  <text class="small" x="875" y="402">as the Plex service</text>

  <path class="flowR" d="M340,380 L395,380" marker-end="url(#aR)"/>
  <path class="flowR" d="M675,380 L730,380" marker-end="url(#aR)"/>
  <text x="540" y="510" style="font-size:24px;font-weight:700;text-anchor:middle;fill:#dc2626">QNAP: internet-exposed devices should be</text>
  <text x="540" y="545" style="font-size:24px;font-weight:700;text-anchor:middle;fill:#dc2626">considered potentially compromised</text>
  <text class="small" x="540" y="583">CVE-2026-96652 · 96654 · 96655 · 96656</text>

  <!-- Panel 2: safe -->
  <rect x="40" y="630" width="1000" height="420" rx="26" fill="#f9fafb" stroke="#059669" stroke-width="2.5"/>
  <text class="panelT" x="70" y="682" style="fill:#059669">✓ QNAP's advice</text>

  <rect class="boxG" x="70" y="720" width="270" height="130" rx="18"/>
  <text class="lbl" x="205" y="773" style="fill:#059669">You, away</text>
  <text class="small" x="205" y="807">phone or laptop</text>

  <rect class="boxB" x="405" y="720" width="270" height="130" rx="18"/>
  <text class="lbl" x="540" y="773">VPN</text>
  <text class="small" x="540" y="807">no port forward</text>

  <rect class="boxG" x="740" y="720" width="270" height="130" rx="18"/>
  <text class="lbl" x="875" y="773" style="fill:#059669">Plex 1.43.3+</text>
  <text class="small" x="875" y="807">updated, patched</text>

  <path class="flowG" d="M340,785 L395,785" marker-end="url(#aG)"/>
  <path class="flowG" d="M675,785 L730,785" marker-end="url(#aG)"/>

  <rect class="box" x="70" y="880" width="940" height="80" rx="18"/>
  <text x="540" y="930" style="font-size:25px;font-weight:700;text-anchor:middle">Don't need remote access? Turn off Plex Remote Access</text>
  <text x="540" y="1012" style="font-size:24px;font-weight:700;text-anchor:middle;fill:#059669">Keep QTS / QuTS hero and every app up to date</text>

  <!-- Takeaway -->
  <rect x="40" y="1075" width="1000" height="205" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text class="panelT" x="70" y="1125" style="fill:#2563eb;font-size:30px">Was port 32400 open? Clean up</text>
  <text x="70" y="1172" style="font-size:25px">① Reinstall Plex</text>
  <text x="70" y="1212" style="font-size:25px">② Rotate both the Plex and the NAS passwords</text>
  <text x="70" y="1252" style="font-size:25px">③ Then reach it only over VPN</text>

  <text x="540" y="1325" style="font-size:24px;font-weight:800;text-anchor:middle">↗ Send this to anyone running Plex on a NAS</text>
</svg>
</body></html>
